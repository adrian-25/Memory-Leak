# Render Blueprint for MemoryLeak.
#
# The API and frontend use Render's private network. PostgreSQL is managed by
# Render and enables pgvector through the existing Alembic migration.
#
# Neo4j is intentionally omitted: it needs a paid private service and
# persistent disk on Render. The API starts without it and reports the graph
# as not configured until an external Neo4j instance is attached.
services:
  - type: web
    name: memory-leak-api
    runtime: python
    repo: https://github.com/adrian-25/Memory-Leak.git
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Free Render services do not support preDeployCommand. Applying the
    # idempotent Alembic migrations immediately before the API starts keeps
    # the schema current on every deploy.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: memory-leak-db
          property: connectionString
      - key: APP_ALLOWED_ORIGINS
        value: https://memory-leak-web.onrender.com
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json

  - type: web
    name: memory-leak-web
    runtime: node
    repo: https://github.com/adrian-25/Memory-Leak.git
    region: singapore
    plan: free
    rootDir: frontend
    # TypeScript and Tailwind are development dependencies but are required by
    # `next build`; include them even though NODE_ENV is production at runtime.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      # This is intentionally a public HTTPS URL. Next.js evaluates the page
      # at runtime, and Render does not expose a private-service host/port to
      # this standalone Node process consistently on the free tier.
      - key: NEXT_INTERNAL_API_URL
        value: https://memory-leak-api.onrender.com

databases:
  - name: memory-leak-db
    region: singapore
    plan: free
    databaseName: memoryleak
    user: memoryleak_user
    ipAllowList: []
