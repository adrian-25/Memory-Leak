# Render Blueprint for MemoryLeak.
#
# The API and frontend use Render's private network. PostgreSQL is managed by
# Render and enables pgvector through the existing Alembic migration.
#
# Before the first deploy, provide credentials for an existing Neo4j instance
# (for example, Neo4j Aura). Running Neo4j on Render needs a paid private
# service and persistent disk, so it is deliberately not created by this
# free-tier-friendly blueprint.
services:
  - type: web
    name: memory-leak-api
    runtime: python
    repo: https://github.com/adrian-25/Memory-Leak.git
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: memory-leak-db
          property: connectionString
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: APP_ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json

  - type: web
    name: memory-leak-web
    runtime: node
    repo: https://github.com/adrian-25/Memory-Leak.git
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_INTERNAL_API_HOSTPORT
        fromService:
          type: web
          name: memory-leak-api
          property: hostport

databases:
  - name: memory-leak-db
    region: singapore
    plan: free
    databaseName: memoryleak
    user: memoryleak_user
    ipAllowList: []
