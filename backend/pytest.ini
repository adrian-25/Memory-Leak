[pytest]
# ── MemoryLeak Backend Test Configuration ────────────────────────────────────
# Run from: backend/ directory
# Usage:
#   pytest                          # run all tests
#   pytest tests/unit/              # unit tests only (no DB needed)
#   pytest tests/integration/       # integration tests (requires running Docker stack)
#   pytest --cov=app --cov-report=term-missing

minversion = 8.0

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# asyncio mode — all async tests use asyncio
asyncio_mode = auto

# Markers
markers =
    unit: Pure unit tests — no external services required
    integration: Integration tests — requires running Docker stack (postgres, neo4j)
    slow: Tests that take > 2 seconds

# Output
addopts =
    --strict-markers
    --tb=short
    -q

# Minimum coverage (enforced only when --cov is passed)
# --cov-fail-under=80
